[package]
name = "keri-protocol"
version = "0.0.0"
description = "KERI protocol messages: events, SAIDs, prefixes, thresholds and CESR attachments"
edition = "2024"
rust-version = "1.97"
publish = false
keywords = ["keri", "kel", "tel", "cesr", "identity"]
categories = ["cryptography", "encoding"]

[dependencies]
keri-cesr = { version = "0.1.0", features = ["crypto"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }

[[bench]]
name = "threshold"
harness = false

[[bench]]
name = "version"
harness = false

[[bench]]
name = "serder"
harness = false

[[bench]]
name = "said"
harness = false

[[bench]]
name = "prefix"
harness = false

[[bench]]
name = "eventing"
harness = false

[[bench]]
name = "registry"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
